<!DOCTYPE html>
<html lang="id" data-font-size="md">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="../assets/js/theme-init.js"></script>
  <title>Masuk | Admin wafaabbas.com</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="same-origin" />
  <link rel="icon" href="../assets/images/logo/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://sjgsrposlucbkabxaodm.supabase.co" crossorigin />
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <link rel="stylesheet" href="../assets/css/admin.css" />
  <link rel="stylesheet" href="../assets/css/theme-dark.css" />
</head>
<body class="admin-body">
<main class="login" id="main-content">
  <form class="login__card" id="login-form" novalidate>
    <img src="../assets/images/logo/wafa-logo-white.svg" alt="wafaabbas.com" width="180" height="26" />
    <h1>Masuk admin</h1>
    <div class="field"><label for="l-email">Email</label><input id="l-email" name="email" type="email" autocomplete="username" required /></div>
    <div class="field"><label for="l-pass">Kata sandi</label><input id="l-pass" name="password" type="password" autocomplete="current-password" required /></div>
    <p class="form-error" id="login-error" role="alert" hidden></p>
    <button class="btn btn--primary btn--block" type="submit" id="login-submit">Masuk</button>
    <p class="field__hint">Akses panel dibatasi untuk pemilik situs. Pendaftaran publik tidak tersedia.</p>
  </form>
</main>
<script src="https://unpkg.com/@supabase/supabase-js@2.117.2"></script>
<script type="module" src="../pages/admin/login.js"></script>
</body>
</html>
